# Build the review-tracker site (Astro + Starlight) on GitHub and deploy it to GitHub Pages.
# Free for public repositories. Pages source: Settings → Pages → "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  # A pull request runs the build and the game check, but it does not publish.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Ubuntu 24.04: the same system as game/dev.sh on the owner's computer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The game: the B side (Fortran) makes the table, the A side (8086 Assembly) uses it,
      # and a check in DOSBox proves that the two sides agree. If the check fails, nothing is published.
      - name: Install the game toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gfortran nasm dosbox

      - name: Build and test the game
        run: bash game/build.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Re-split documents and re-map findings so segment pages always match review/findings/*.json.
      - name: Regenerate segments
        run: python3 review/segments/split_documents.py

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build (sync review/ -> Astro -> serve/)
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: serve

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ask Facebook to re-scrape the pages so shared links show the new title, description and image.
  # Needs the repository secret FACEBOOK_APP_TOKEN ("<app-id>|<app-secret>" from a Facebook developer app).
  # Without it, the job logs a notice and succeeds, so deploys never fail because of Facebook.
  refresh-link-previews:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      FACEBOOK_APP_TOKEN: ${{ secrets.FACEBOOK_APP_TOKEN }}
      PAGES: >-
        https://kairin.github.io/000-111-learn/
        https://kairin.github.io/000-111-learn/findings/
        https://kairin.github.io/000-111-learn/plan/
    steps:
      - name: Re-scrape on Facebook
        run: |
          if [ -z "$FACEBOOK_APP_TOKEN" ]; then
            echo "::notice::FACEBOOK_APP_TOKEN not set; skipping the Facebook re-scrape. See review/README.md (Link previews)."
            exit 0
          fi
          sleep 30   # give the Pages CDN time to serve the new build
          for url in $PAGES; do
            # The token goes in the POST body via stdin, never on the command line or in the URL.
            resp=$(printf '%s' "$FACEBOOK_APP_TOKEN" | curl -sS -X POST https://graph.facebook.com/ \
              --data-urlencode "id=$url" -d scrape=true --data-urlencode "access_token@-")
            if echo "$resp" | grep -q '"error"'; then
              echo "::warning::Facebook re-scrape failed for $url: $(echo "$resp" | head -c 300)"
            else
              echo "Re-scraped $url: $(echo "$resp" | grep -o '"title":"[^"]*"' | head -1)"
            fi
          done
          # A Facebook failure is reported as a warning but doesn't fail the deploy.
          exit 0
