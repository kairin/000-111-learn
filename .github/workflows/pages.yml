# Publishes the prebuilt static site in serve/ to GitHub Pages.
# Build locally first (uv run site/build.py) and commit serve/; this workflow only uploads it.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy review tracker to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["serve/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: serve
      - id: deployment
        uses: actions/deploy-pages@v4
